<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pyventory | Novo Cadastro</title>
    <style>
        body { background-color: #0c0c0c; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 50px; text-align: center; }
        .login-box { border: 1px solid #00ff00; padding: 30px; display: inline-block; text-align: left; background-color: #001100; min-width: 300px; }
        input { background-color: #000000; color: #00ff00; border: 1px solid #005500; padding: 10px; font-family: inherit; margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .btn { background: none; color: #00ff00; border: 1px solid #00ff00; padding: 10px 20px; font-family: inherit; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:hover { background-color: #00ff00; color: #0c0c0c; }
        .helptext, ul { color: #55aa55; font-size: 0.8em; margin-top: -10px; margin-bottom: 15px; }
        .errorlist { color: #ff3333; list-style-type: none; padding: 0; }
        a { color: #00ff00; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>> NOVO_LOJISTA</h2>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">> REGISTRAR_SISTEMA</button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9em;">
            Já possui acesso? <a href="{% url 'login' %}">[ INICIAR SESSÃO ]</a>
        </p>
    </div>
</body>
</html>
