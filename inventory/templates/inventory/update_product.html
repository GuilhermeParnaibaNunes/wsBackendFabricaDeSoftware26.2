<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pyventory | Atualizar</title>
    <style>
        /* TEMA MATRIX/TERMINAL */
        body { background-color: #0c0c0c; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 20px; }
        h1 { border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        a { color: #00ff00; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        a:hover { background-color: #00ff00; color: #0c0c0c; }
        
        form { max-width: 600px; }
        p { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        
        input, textarea { width: 100%; background-color: #001100; color: #00ff00; border: 1px solid #005500; padding: 10px; font-family: 'Courier New', Courier, monospace; box-sizing: border-box; }
        input:focus, textarea:focus { outline: none; border: 1px solid #00ff00; background-color: #000000; }
        
        .btn { background: none; color: #00ff00; border: 1px solid #00ff00; padding: 10px 20px; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        .btn:hover { background-color: #00ff00; color: #0c0c0c; }
        .errorlist { color: #ff3333; list-style-type: none; padding: 0; margin-top: 5px; font-size: 0.9em; }
    </style>
</head>
<body>

    <header>
        <h1>> ATUALIZAR_REGISTRO: [{{ product.sku }}]</h1>
        <!-- Botão para abortar a edição e voltar para os detalhes -->
        <a href="{% url 'product_detail' product.sku %}"> [ <- ] CANCELAR E VOLTAR </a>
    </header>

    <main>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">> SOBRESCREVER_DADOS</button>
        </form>
    </main>

</body>
</html>
